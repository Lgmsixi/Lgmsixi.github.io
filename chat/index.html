<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="/resources/cssAndJS/default.css" rel="stylesheet" type="text/css">
<script src="/resources/cssAndJS/default.js"></script>
<title>Home</title>
	<style>
		body
		{
			width: 100vw;
			height: 100vh;
			margin: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: rgba(127,127,127,1.00);
			background-image: url("https://bing.img.run/1366x768.php");
			background-repeat: no-repeat;
			background-size: cover;
		}
		#bgGuide
		{
			position: relative;
		}
		#guide
		{
			position: relative;
			width: 200px;
			padding-left: 10%;
			color: rgba(0,0,0,0.80);
		}
		#bgBlurCover
		{
			backdrop-filter: blur(50px);
		}
		.LRDButtons
		{
/*			width: 80%;*/
/*			background-color: rgba(22,51,188,0.90);*/
			font-weight: 1000;
			position: relative;
			bottom: 20px;
/*			right: ;*/
		}
		.LRDButtons:hover
		{
			color: white;
			background-color: rgba(22,51,188,1.00);
			box-shadow: 0 0 10px 5px rgba(22,51,188,0.20);
		}
		#msgInputContainer
		{
			position: fixed;
			margin: 20px 10%;
			width: calc(calc(100vw - 20%) - 13px);
			left: 0;
			bottom: 0;
			background-color: rgba(255,255,255,0.20);
			height: 100px;
			border-radius: 15px;
			padding: 10px;
		}
		#msgInput
		{
			width: calc(100% - 75px);
			height: 100%;
			background-color: rgba(0,0,0,0.00);
			border: none;
/*			resize: vertical;*/
			resize: none;
			font-size: 18px;
		}
/*
		#msgInput::-webkit-scrollbar
		{
		}
		#msgInput::-webkit-scrollbar-corner
		{
			border-radius: 15px;
		}
*/
	</style>
</head>

<body>
	<video class="bg" muted="false" autoplay loop>
<!--		<source src="https://eacf9feb-2f8d-4c70-b392-bc69123476f7.mdnplay.dev/shared-assets/videos/flower.webm">-->
	</video>
	<div class="bg" id="bgBlurCover"></div>
	<div id="msgContainer">
		<div id="messages">
		</div>
		<div id="msgInputContainer" class="input">
			<span><textarea id="msgInput" placeholder="Please enter your words."></textarea></span>
			<span><input type="submit" value="Send" class="button buttonStyle1 LRDButtons" id="sendMessage"></span>
		</div>
	</div>
</body>
</html>
